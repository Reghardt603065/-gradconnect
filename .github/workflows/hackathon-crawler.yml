name: Hackathon Crawler

on:
  workflow_dispatch:

concurrency:
  group: gradconnect-hackathon-crawler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    name: Crawl approved hackathon pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GRADCONNECT_API_URL: ${{ secrets.GRADCONNECT_API_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hackathon-crawler/requirements.txt

      - name: Validate crawler configuration
        shell: bash
        run: |
          if [ -z "$GRADCONNECT_API_URL" ]; then
            echo "GRADCONNECT_API_URL repository secret is missing."
            exit 1
          fi

      - name: Install crawler dependencies
        working-directory: hackathon-crawler
        run: python -m pip install -r requirements.txt

      - name: Verify GradConnect crawler API
        working-directory: hackathon-crawler
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          from hackathon_crawler.config import get_crawler_auth_headers

          base_url = os.environ["GRADCONNECT_API_URL"].rstrip("/")
          url = f"{base_url}/api/internal/hackathons/crawl-targets"
          auth_headers = get_crawler_auth_headers()

          if not auth_headers:
              raise SystemExit("GitHub OIDC authentication was not available to the crawler job.")

          request = urllib.request.Request(
              url,
              headers={
                  **auth_headers,
                  "User-Agent": "GradConnectHackathonCrawler/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"GradConnect crawler API returned HTTP {exc.code}: {body}"
              ) from exc

          if not body.get("ok"):
              raise SystemExit(f"GradConnect crawler API rejected the request: {body}")

          targets = body.get("data") or []
          print(
              "GitHub OIDC authenticated successfully. "
              f"Active targets: {len(targets)}"
          )
          PY

      - name: Run hackathon crawler
        working-directory: hackathon-crawler
        run: scrapy crawl hackathon_spider
